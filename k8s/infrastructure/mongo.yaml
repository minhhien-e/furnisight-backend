apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
  namespace: furnisight-infras
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: furnisight-infras
spec:
  serviceName: "mongo"
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
        - name: mongo-init
          image: mongo:7
          command: ["/bin/bash", "-c"]
          args:
            - |
              sleep 10
              mongosh --host 127.0.0.1:27017 --eval "try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo-0.mongo.furnisight-infras.svc.cluster.local:27017' }] }); } catch(e) { print('Replica set already initialized'); }" || true
              sleep 5
              mongosh --host 127.0.0.1:27017 /mongo-init.js || true
              sleep infinity
          volumeMounts:
            - name: init-script
              mountPath: /mongo-init.js
              subPath: mongo-init.js
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-pvc
        - name: init-script
          configMap:
            name: mongo-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: furnisight-infras
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    app: mongo
