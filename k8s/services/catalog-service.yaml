apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: furnisight-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: catalog-service
          image: furnisight-catalog-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
            - containerPort: 9090
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx512m -Xms256m -Xss512k -XX:+UseG1GC -XX:MaxMetaspaceSize=256m -Dserver.tomcat.threads.max=200"
          envFrom:
            - configMapRef:
                name: shared-env
            - configMapRef:
                name: catalog-service-env
            - secretRef:
                name: furnisight-secrets
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 2000m
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health
              port: 8080
            initialDelaySeconds: 240
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: furnisight-apps
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 9090
      targetPort: 9090
  selector:
    app: catalog-service
