apiVersion: apps/v1
kind: Deployment
metadata:
  name: promotion-service
  namespace: furnisight-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: promotion-service
  template:
    metadata:
      labels:
        app: promotion-service
    spec:
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      containers:
      - name: promotion-service
        image: furnisight-promotion-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        - containerPort: 9090
        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-Xmx256m -Xms128m -Xss512k -XX:+UseG1GC -XX:MaxMetaspaceSize=128m -Dserver.tomcat.threads.max=100"
        envFrom:
        - configMapRef:
            name: shared-env
        - configMapRef:
            name: promotion-service-env
        - secretRef:
            name: furnisight-secrets
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /api/v1/actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/v1/actuator/health
            port: 8080
          initialDelaySeconds: 240
          periodSeconds: 15
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: promotion-service
  namespace: furnisight-apps
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: grpc
    port: 9090
    targetPort: 9090
  selector:
    app: promotion-service
