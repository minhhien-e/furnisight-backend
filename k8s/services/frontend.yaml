apiVersion: apps/v1
kind: Deployment
metadata:
  name: furnisight-frontend
  namespace: furnisight-frontend
  labels:
    app: furnisight-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: furnisight-frontend
  template:
    metadata:
      labels:
        app: furnisight-frontend
    spec:
      containers:
        - name: furnisight-frontend
          image: furnisight-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: nginx-config-volume
          configMap:
            name: frontend-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: furnisight-frontend
  namespace: furnisight-frontend
  labels:
    app: furnisight-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: furnisight-frontend
