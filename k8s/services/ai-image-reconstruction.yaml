apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-image-reconstruction
  namespace: furnisight-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-image-reconstruction
  template:
    metadata:
      labels:
        app: ai-image-reconstruction
    spec:
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      containers:
      - name: ai-image-reconstruction
        image: furnisight-ai-image-reconstruction:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: shared-env
        - configMapRef:
            name: ai-image-reconstruction-env
        - secretRef:
            name: furnisight-secrets
        resources:
          requests:
            memory: 1Gi
            cpu: 500m
          limits:
            memory: 4Gi
            cpu: 2000m
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 240
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ai-image-reconstruction
  namespace: furnisight-apps
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: ai-image-reconstruction
