apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: furnisight-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
    spec:
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      containers:
        - name: media-service
          image: furnisight-media-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

          envFrom:
          - configMapRef:
              name: shared-env
          - configMapRef:
              name: media-service-env
          - secretRef:
              name: furnisight-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health # Hoặc /actuator/health tùy service
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: furnisight-apps
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080

  selector:
    app: media-service
