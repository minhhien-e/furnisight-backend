apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-image-classifier
  namespace: furnisight-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-image-classifier
  template:
    metadata:
      labels:
        app: ai-image-classifier
    spec:
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      containers:
      - name: ai-image-classifier
        image: furnisight-ai-image-classifier:latest
        imagePullPolicy: IfNotPresent
        command:
        - uvicorn
        - app.main:app
        - --host
        - 0.0.0.0
        - --port
        - '8080'
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: shared-env
        - configMapRef:
            name: ai-image-classifier-env
        - secretRef:
            name: furnisight-secrets
        resources:
          requests:
            memory: 512Mi
            cpu: 200m
          limits:
            memory: 2Gi
            cpu: 1000m
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 240
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ai-image-classifier
  namespace: furnisight-apps
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: ai-image-classifier
