apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-review-sentiment
  namespace: furnisight-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-review-sentiment
  template:
    metadata:
      labels:
        app: ai-review-sentiment
    spec:
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      containers:
      - name: ai-review-sentiment
        image: furnisight-ai-review-sentiment:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        - containerPort: 9090
        envFrom:
        - configMapRef:
            name: shared-env
        - configMapRef:
            name: ai-review-sentiment-env
        - secretRef:
            name: furnisight-secrets
        resources:
          requests:
            memory: 512Mi
            cpu: 200m
          limits:
            memory: 2Gi
            cpu: 1000m
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 240
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ai-review-sentiment
  namespace: furnisight-apps
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: grpc
    port: 9090
    targetPort: 9090
  selector:
    app: ai-review-sentiment
