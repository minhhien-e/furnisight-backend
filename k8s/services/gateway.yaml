apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: furnisight-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      containers:
      - name: gateway
        image: furnisight-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: shared-env
        - configMapRef:
            name: gateway-env
        - secretRef:
            name: furnisight-secrets
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 240
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: furnisight-apps
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: gateway
