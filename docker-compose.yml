services:
  # --- Databases & Infrastructure ---
  postgres:
    image: postgres:13.1-alpine
    container_name: furnisight_user_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d furnisight_user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: mongo-rs
    restart: always
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db

  mongo-init:
    image: mongo:7
    depends_on:
      - mongo
    restart: "no"
    volumes:
      - ./notification-service/mongo-init.js:/mongo-init.js
    entrypoint: >
      bash -c "
        sleep 5
        mongosh --host mongo:27017 --eval \"try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }); } catch(e) { print('Replica set already initialized'); }\"
        sleep 5
        mongosh --host mongo:27017 /mongo-init.js
      "

  redis:
    image: redis:7
    container_name: redis-server
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: furnisight_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: furnisight_kafka_ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: furnisight_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=furnisight-cluster
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: furnisight_kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  # --- Microservices ---
  gateway:
    image: furnisight-gateway:latest
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: furnisight_gateway
    ports:
      - "8080:8080"
    env_file:
      - ./gateway/.env
    environment:
      - USER_SERVICE_URL=http://user-service:8080
      - CATALOG_SERVICE_URL=http://catalog-service:8080
      - NOTIFICATION_SERVICE_URL=http://notification-service:8080
    depends_on:
      - redis
      - zipkin
      - user-service
      - catalog-service
      - notification-service
    restart: always

  user-service:
    image: furnisight-user-service:latest
    build:
      context: ./user-service
      dockerfile: Dockerfile
      args:
        - GITHUB_ACTOR=${GITHUB_ACTOR}
      secrets:
        - GITHUB_TOKEN
    container_name: furnisight_user_service
    ports:
      - "8081:8080"
    env_file:
      - ./user-service/.env
    environment:
      - SERVER_PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: always

  catalog-service:
    image: furnisight-catalog-service:latest
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
      args:
        - GITHUB_ACTOR=${GITHUB_ACTOR}
      secrets:
        - GITHUB_TOKEN
    container_name: furnisight_catalog_service
    ports:
      - "8083:8080"
    env_file:
      - ./catalog-service/.env
    environment:
      - SERVER_PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: always

  notification-service:
    image: furnisight-notification-service:latest
    build:
      context: ./notification-service
      dockerfile: Dockerfile
      args:
        - GITHUB_ACTOR=${GITHUB_ACTOR}
      secrets:
        - GITHUB_TOKEN
    container_name: furnisight_notification_service
    ports:
      - "8082:8080"
      - "9091:9091"
    env_file:
      - ./notification-service/.env
    environment:
      - SERVER_PORT=8080
    depends_on:
      - mongo
      - kafka
    restart: always

  ai-image-classifier:
    image: furnisight-ai-image-classifier:latest
    build:
      context: ./ai-image-classifier
      dockerfile: Dockerfile
    container_name: furnisight_ai_classifier
    ports:
      - "8000:8080"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    restart: always

  media-service:
    image: furnisight-media-service:latest
    build:
      context: ./media-service
      dockerfile: Dockerfile
      args:
        - GITHUB_ACTOR=${GITHUB_ACTOR}
      secrets:
        - GITHUB_TOKEN
    container_name: furnisight_media_service
    ports:
      - "8084:8080"
    env_file:
      - ./media-service/.env
    volumes:
      - media_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  review-service:
    image: furnisight-review-service:latest
    build:
      context: ./review-service
      dockerfile: Dockerfile
      args:
        - GITHUB_ACTOR=${GITHUB_ACTOR}
      secrets:
        - GITHUB_TOKEN
    container_name: furnisight_review_service
    ports:
      - "8085:8080"
    env_file:
      - ./review-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: always

  clamav:
    image: clamav/clamav:latest
    container_name: furnisight_clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  kafka_data:
  media_storage:
  clamav_data:
  elasticsearch_data:

secrets:
  GITHUB_TOKEN:
    environment: GITHUB_TOKEN
