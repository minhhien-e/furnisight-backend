x-common-service: &common-service
  restart: always

x-java-build: &java-build
  dockerfile: Dockerfile
  args:
    - GITHUB_ACTOR=${GITHUB_ACTOR}
  secrets:
    - GITHUB_TOKEN

x-java-service: &java-service
  <<: *common-service
  environment:
    SERVER_PORT: 8080
  expose:
    - "8080"

x-postgres-dep: &postgres-dep
  postgres:
    condition: service_healthy

x-kafka-dep: &kafka-dep
  kafka:
    condition: service_healthy

services:
  postgres:
    image: postgres:13.1-alpine
    container_name: furnisight_user_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d furnisight_user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: mongo-rs
    <<: *common-service
    expose:
      - "27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db

  mongo-init:
    image: mongo:7
    depends_on:
      - mongo
    restart: "no"
    volumes:
      - ./mongo-init.js:/mongo-init.js
    entrypoint: >
      bash -c "
        sleep 5 &&
        mongosh --host mongo:27017 --eval \"try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }); } catch(e) { print('Replica set already initialized'); }\" &&
        sleep 5 &&
        mongosh --host mongo:27017 /mongo-init.js
      "

  redis:
    image: redis:7
    container_name: redis-server
    <<: *common-service
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: furnisight_kafka
    restart: unless-stopped
    expose:
      - "29092"
      - "29093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server kafka:29092 --list || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    <<: *common-service
    ports:
      - "9411:9411"

  gateway:
    image: furnisight-gateway:latest
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: furnisight_gateway
    <<: *common-service
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ./gateway/.env
    depends_on:
      redis:
        condition: service_started
      zipkin:
        condition: service_started
      user-service:
        condition: service_healthy
      catalog-service:
        condition: service_started
      cart-service:
        condition: service_started
      notification-service:
        condition: service_started
      message-service:
        condition: service_healthy
      order-service:
        condition: service_started
      promotion-service:
        condition: service_started
      media-service:
        condition: service_started
      ai-image-classifier:
        condition: service_started
      ai-image-reconstruction:
        condition: service_started
      admin-service:
        condition: service_started

  user-service:
    <<: *java-service
    image: furnisight-user-service:latest
    container_name: furnisight_user_service
    build:
      context: ./user-service
      <<: *java-build
    env_file:
      - ./user-service/.env
    expose:
      - "8080"
      - "9091"
    depends_on:
      <<: [*postgres-dep, *kafka-dep]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  admin-service:
    <<: *java-service
    image: furnisight-admin-service:latest
    container_name: furnisight_admin_service
    build:
      context: ./admin-service
      <<: *java-build
    env_file:
      - ./admin-service/.env
    volumes:
      - admin_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      zipkin:
        condition: service_started
      user-service:
        condition: service_started
      order-service:
        condition: service_started
      promotion-service:
        condition: service_started
      catalog-service:
        condition: service_started

  catalog-service:
    <<: *java-service
    image: furnisight-catalog-service:latest
    container_name: furnisight_catalog_service
    build:
      context: ./catalog-service
      <<: *java-build
    env_file:
      - ./catalog-service/.env
    expose:
      - "8080"
      - "9093"
    depends_on:
      <<: [*postgres-dep, *kafka-dep]

  cart-service:
    <<: *java-service
    image: furnisight-cart-service:latest
    container_name: furnisight_cart_service
    build:
      context: ./cart-service
      <<: *java-build
    expose:
      - "8080"
      - "9094"
    env_file:
      - ./cart-service/.env
    depends_on:
      - mongo

  notification-service:
    <<: *java-service
    image: furnisight-notification-service:latest
    container_name: furnisight_notification_service
    build:
      context: ./notification-service
      <<: *java-build
    expose:
      - "8080"
      - "9091"
    env_file:
      - ./notification-service/.env
    depends_on:
      - mongo
      - kafka

  order-service:
    <<: *java-service
    image: furnisight-order-service:latest
    container_name: furnisight_order_service
    build:
      context: ./order-service
      <<: *java-build
    expose:
      - "8080"
      - "9095"
    env_file:
      - ./order-service/.env
    depends_on:
      <<: [*postgres-dep, *kafka-dep]

  promotion-service:
    <<: *java-service
    image: furnisight-promotion-service:latest
    container_name: furnisight_promotion_service
    build:
      context: ./promotion-service
      <<: *java-build
    expose:
      - "8080"
      - "9096"
    env_file:
      - ./promotion-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      notification-service:
        condition: service_started
      user-service:
        condition: service_started
      order-service:
        condition: service_started
      cart-service:
        condition: service_started
      catalog-service:
        condition: service_started

  ai-image-classifier:
    image: furnisight-ai-image-classifier:latest
    build:
      context: ./ai-image-classifier
      dockerfile: Dockerfile
    container_name: furnisight_ai_classifier
    <<: *common-service
    expose:
      - "8080"
    environment:
      CATALOG_GRPC_TARGET: catalog-service:9093
    depends_on:
      - catalog-service
    volumes:
      - ./ai-image-classifier/models:/app/models:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]

  ai-image-reconstruction:
    image: furnisight-ai-image-reconstruction:latest
    build:
      context: ./ai-image-reconstruction
      dockerfile: Dockerfile
      args:
        TORCH_WHEEL: ${TORCH_WHEEL:-}
    container_name: furnisight_ai_reconstruction
    <<: *common-service
    env_file:
      - ./media-service/.env
      - ./ai-image-reconstruction/.env
    environment:
      STORAGE_BACKEND: ${AI_RECONSTRUCTION_STORAGE_BACKEND:-cloudinary}
      CLOUDINARY_FOLDER: ${AI_RECONSTRUCTION_CLOUDINARY_FOLDER:-furnisight/ai-reconstruction}
      RETAIN_LOCAL_OUTPUTS: ${AI_RECONSTRUCTION_RETAIN_LOCAL_OUTPUTS:-false}
    volumes:
      - ./ai-image-reconstruction/checkpoints:/app/checkpoints:ro
      - ./ai-image-reconstruction/outputs:/app/outputs
    expose:
      - "8080"

  media-service:
    <<: *java-service
    image: furnisight-media-service:latest
    container_name: furnisight_media_service
    build:
      context: ./media-service
      <<: *java-build
    env_file:
      - ./media-service/.env
    volumes:
      - media_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  message-service:
    <<: *java-service
    image: furnisight-message-service:latest
    container_name: furnisight_message_service
    build:
      context: ./message-service
      <<: *java-build
    env_file:
      - ./message-service/.env
    depends_on:
      <<: [*postgres-dep, *kafka-dep]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  kafka_data:
  media_storage:
  admin_data:

secrets:
  GITHUB_TOKEN:
    environment: GITHUB_TOKEN
