services:
  # --- Databases & Infrastructure ---
  postgres:
    image: postgres:13.1-alpine
    container_name: furnisight_user_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: furnisight_user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d furnisight_user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: mongo-rs
    restart: always
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db

  mongo-init:
    image: mongo:7
    depends_on:
      - mongo
    restart: "no"
    volumes:
      - ./notification-service/mongo-init.js:/mongo-init.js
    entrypoint: >
      bash -c "
        sleep 5
        mongosh --host mongo:27017 --eval \"try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }); } catch(e) { print('Replica set already initialized'); }\"
        sleep 5
        mongosh --host mongo:27017 /mongo-init.js
      "

  redis:
    image: redis:7
    container_name: redis-server
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: furnisight_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: furnisight_kafka_ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    restart: always

  # --- Microservices ---
  gateway:
    image: furnisight-gateway:latest
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: furnisight_gateway
    ports:
      - "8080:8080"
    env_file:
      - ./gateway/.env
    depends_on:
      - redis
      - zipkin
      - user-service
    restart: always

  user-service:
    image: furnisight-user-service:latest
    build:
      context: ./user-service
      dockerfile: Dockerfile
      args:
        - GITHUB_ACTOR=${GITHUB_ACTOR}
      secrets:
        - GITHUB_TOKEN
    container_name: furnisight_user_service
    ports:
      - "8081:8081"
    env_file:
      - ./user-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: always

  notification-service:
    image: furnisight-notification-service:latest
    build:
      context: ./notification-service
      dockerfile: Dockerfile
      args:
        - GITHUB_ACTOR=${GITHUB_ACTOR}
      secrets:
        - GITHUB_TOKEN
    container_name: furnisight_notification_service
    ports:
      - "8082:8082"
      - "9091:9091"
    env_file:
      - ./notification-service/.env
    depends_on:
      - mongo
      - kafka
    restart: always

  ai-image-classifier:
    image: furnisight-ai-image-classifier:latest
    build:
      context: ./ai-image-classifier
      dockerfile: Dockerfile
    container_name: furnisight_ai_classifier
    ports:
      - "8000:8000"
    restart: always

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  kafka_data:

secrets:
  GITHUB_TOKEN:
    environment: GITHUB_TOKEN
