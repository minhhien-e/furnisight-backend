<!DOCTYPE html>
<html>
<head>
  <script src="https://editor.unlayer.com/embed.js"></script>
</head>
<body>
  <button id="openBtn">Open Unlayer</button>
  <button id="loadBtn">Load Design</button>
  <div id="unlayer-container" style="height: 500px; display: none;"></div>
  <script>
    let initialized = false;
    document.getElementById('openBtn').addEventListener('click', () => {
      document.getElementById('unlayer-container').style.display = 'block';
      if (!initialized) {
        unlayer.init({ id: 'unlayer-container', displayMode: 'email' });
        initialized = true;
      }
    });
    document.getElementById('loadBtn').addEventListener('click', () => {
      unlayer.loadBlank({ backgroundColor: '#ff0000' });
      console.log('loaded blank red');
    });
  </script>
</body>
</html>
