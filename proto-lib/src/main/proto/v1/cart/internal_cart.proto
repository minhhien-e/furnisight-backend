syntax = "proto3";

package com.furnisight.internal.cart;

option java_multiple_files = true;
option java_package = "com.furnisight.internal.cart";
option java_outer_classname = "InternalCartProto";

import "google/protobuf/empty.proto";

service InternalCartService {
    rpc GetAbandonedCartUserIds (google.protobuf.Empty) returns (AbandonedCartUserIdsResponse);
}

message AbandonedCartUserIdsResponse {
    repeated string user_ids = 1;
}
