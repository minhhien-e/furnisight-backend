syntax = "proto3";

package v1.media;

option java_multiple_files = true;
option java_package = "com.furnisight.media";

message MediaResponse {
    string id = 1;
    string name = 2;

    string previewUrl = 3;
    string downloadUrl = 4;

    string contentType = 5;
    int64 size = 6;

    MediaStatus status = 7;

    int64 createdAt = 8;
    string ownerId = 9;
}

enum MediaStatus {
    PENDING_UPLOAD = 0;
    ACTIVE = 1;
    FAILED = 2;
}
