syntax = "proto3";

package com.furnisight.admin.order;

option java_multiple_files = true;
option java_package = "com.furnisight.admin.order";
option java_outer_classname = "AdminOrderProto";

import "google/protobuf/empty.proto";

service AdminOrderService {
    rpc GetAdminOrders (GetAdminOrdersRequest) returns (OrderPageResponse);
    rpc GetOrderStats (google.protobuf.Empty) returns (OrderStatsResponse);
    rpc GetRecentOrders (GetRecentOrdersRequest) returns (RecentOrderListResponse);
    rpc GetAdminVouchers (GetAdminVouchersRequest) returns (VoucherListResponse);
    rpc CreateVoucher (CreateVoucherRequest) returns (AdminActionResponse);
    rpc UpdateVoucher (UpdateVoucherRequest) returns (AdminActionResponse);
    rpc DeleteVoucher (DeleteVoucherRequest) returns (AdminActionResponse);
    rpc ShipOrder (ShipOrderRequest) returns (AdminActionResponse);
    rpc DeliverOrder (DeliverOrderRequest) returns (AdminActionResponse);
    rpc UpdateOrderStatus (UpdateOrderStatusRequest) returns (AdminActionResponse);
    rpc GetRevenueSummary (GetRevenueSummaryRequest) returns (RevenueSummaryResponse);
    rpc GetTopSellingProducts (GetTopSellingProductsRequest) returns (TopSellingProductsResponse);
}

message AdminActionResponse {
    bool success = 1;
    string message = 2;
}

message GetAdminOrdersRequest {
    int32 page = 1;
    int32 size = 2;
    string status = 3;
    string query = 4;
}

message OrderPageResponse {
    repeated OrderDto orders = 1;
    int32 total_pages = 2;
    int64 total_elements = 3;
    int32 current_page = 4;
}

message OrderDto {
    string id = 1;
    string order_code = 2;
    string status = 3;
    double total_amount = 4;
    string created_at = 5;
    string payment_method = 6;
    string first_product_image = 7;
    string customer = 8;
    int32 item_count = 9;
}

message OrderStatsResponse {
    double total_revenue = 1;
    double revenue_this_month = 2;
    int64 total_orders = 3;
    repeated OrderStatusCount orders_by_status = 4;
    int64 orders_today = 5;
    repeated ChartPoint revenue_chart = 6;
    repeated OrderStatusCount orders_this_month_by_status = 7;
}

message OrderStatusCount {
    string status = 1;
    string label = 2;
    int64 count = 3;
}

message ChartPoint {
    string label = 1;
    double value = 2;
}

message GetAdminVouchersRequest {
    string query = 1;
    string status = 2;
}

message VoucherListResponse {
    repeated VoucherDto vouchers = 1;
}

message VoucherDto {
    string id = 1;
    string code = 2;
    string name = 3;
    string description = 4;
    string icon = 5;
    string discount_type = 6;
    double discount_value = 7;
    double max_discount = 8;
    double min_order = 9;
    string start_date = 10;
    string end_date = 11;
    bool active = 12;
    string status_label = 13;
}

message CreateVoucherRequest {
    string code = 1;
    string name = 2;
    string description = 3;
    string icon = 4;
    string discount_type = 5;
    double discount_value = 6;
    double max_discount = 7;
    double min_order = 8;
    string start_date = 9;
    string end_date = 10;
    bool active = 11;
}

message UpdateVoucherRequest {
    string id = 1;
    string code = 2;
    string name = 3;
    string description = 4;
    string icon = 5;
    string discount_type = 6;
    double discount_value = 7;
    double max_discount = 8;
    double min_order = 9;
    string start_date = 10;
    string end_date = 11;
    bool active = 12;
}

message DeleteVoucherRequest {
    string id = 1;
}

message GetRecentOrdersRequest {
    int32 limit = 1;
}

message RecentOrderListResponse {
    repeated OrderDto orders = 1;
}

message ShipOrderRequest {
    string admin_id = 1;
    string order_code = 2;
}

message DeliverOrderRequest {
    string admin_id = 1;
    string order_code = 2;
}

message UpdateOrderStatusRequest {
    string admin_id = 1;
    string order_code = 2;
    string status = 3;
}

// Revenue summary
message GetRevenueSummaryRequest {
    int32 months = 1; // số tháng gần nhất, mặc định 12
}

message RevenueSummaryResponse {
    repeated MonthlyRevenue monthly = 1;
    double total_revenue = 2;
    double revenue_this_month = 3;
    int64 total_orders = 4;
    int64 orders_this_month = 5;
}

message MonthlyRevenue {
    string year_month = 1;    // "2026-05"
    string label = 2;         // "T5/2026"
    double revenue = 3;
    int64  order_count = 4;
    double mom_change_pct = 5; // % so với tháng trước
}

message GetTopSellingProductsRequest {
    int32 limit = 1;
}

message TopSellingProductsResponse {
    repeated TopProductDto products = 1;
}

message TopProductDto {
    string product_id = 1;
    string product_name = 2;
    string category_name = 3;
    string image_url = 4;
    double price = 5;
    int32 sold_count = 6;
    double total_revenue = 7;
}
