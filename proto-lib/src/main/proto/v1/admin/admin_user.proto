syntax = "proto3";

package com.furnisight.admin.user;

option java_multiple_files = true;
option java_package = "com.furnisight.admin.user";
option java_outer_classname = "AdminUserProto";

import "google/protobuf/empty.proto";

service AdminUserService {
    rpc GetAccounts (GetAccountsRequest) returns (AccountPageResponse);
    rpc GetAccountById (GetAccountByIdRequest) returns (AccountDetailResponse);
    rpc GetAccountStats (google.protobuf.Empty) returns (AccountStatsResponse);
    rpc BanAccount (BanAccountRequest) returns (AdminActionResponse);
    rpc UnbanAccount (UnbanAccountRequest) returns (AdminActionResponse);
    rpc ActivateAccount (ActivateAccountRequest) returns (AdminActionResponse);
    rpc DeleteAccount (DeleteAccountRequest) returns (AdminActionResponse);
    rpc GetRoles (google.protobuf.Empty) returns (RoleListResponse);
    rpc CreateRole (CreateRoleRequest) returns (AdminActionResponse);
    rpc UpdateRole (UpdateRoleRequest) returns (AdminActionResponse);
    rpc DeleteRole (DeleteRoleRequest) returns (AdminActionResponse);
    rpc SyncRolePermissions (SyncRolePermissionsRequest) returns (AdminActionResponse);
    rpc AssignRole (AssignRoleRequest) returns (AdminActionResponse);
    rpc RevokeRole (RevokeRoleRequest) returns (AdminActionResponse);
    rpc CreateAccount (CreateAccountRequest) returns (AdminActionResponse);
    rpc UpdateAccountProfile (UpdateAccountProfileRequest) returns (AdminActionResponse);
    rpc UpdateUserStatus (UpdateUserStatusRequest) returns (AdminActionResponse);
    rpc ListMarketingUserIds (ListMarketingUserIdsRequest) returns (MarketingUserIdsResponse);
    rpc FilterMarketingUserIds (FilterMarketingUserIdsRequest) returns (FilterMarketingUserIdsResponse);
    rpc BatchGetMarketingUsers (BatchGetMarketingUsersRequest) returns (MarketingUsersResponse);
}

message ListMarketingUserIdsRequest {
    MarketingUserSegment segment = 1;
}

enum MarketingUserSegment {
    MARKETING_USER_SEGMENT_ALL = 0;
    MARKETING_USER_SEGMENT_NEW_USERS = 1;
    MARKETING_USER_SEGMENT_INACTIVE_30D = 2;
}

message MarketingUserIdsResponse {
    repeated string user_ids = 1;
}

message FilterMarketingUserIdsRequest {
    repeated string user_ids = 1;
}

message FilterMarketingUserIdsResponse {
    repeated string eligible_user_ids = 1;
    repeated string administrative_user_ids = 2;
}

message BatchGetMarketingUsersRequest {
    repeated string user_ids = 1;
}

message MarketingUserDto {
    string user_id = 1;
    string email = 2;
    string name = 3;
    bool active = 4;
    repeated string roles = 5;
}

message MarketingUsersResponse {
    repeated MarketingUserDto users = 1;
}

message CreateAccountRequest {
    string admin_id = 1;
    string email = 2;
    string name = 3;
    string phone = 4;
    string password = 5;
    string role_id = 6;
    bool is_admin = 7;
}

message AdminActionResponse {
    bool success = 1;
    string message = 2;
}

message GetAccountsRequest {
    int32 page = 1;
    int32 size = 2;
    string query = 3;
    string status = 4;
    optional bool is_admin = 5;
}

message AccountPageResponse {
    repeated AccountDto accounts = 1;
    int32 total_pages = 2;
    int64 total_elements = 3;
    int32 current_page = 4;
}

message AccountDto {
    string id = 1;
    string email = 2;
    string username = 3;
    string status = 4;
    string created_at = 5;
    string phone = 6;
    repeated RoleDto roles = 7;
    string name = 8;
}

message GetAccountByIdRequest {
    string id = 1;
}

message AccountDetailResponse {
    string id = 1;
    string email = 2;
    string username = 3;
    string status = 4;
    string created_at = 5;
    string first_name = 6;
    string last_name = 7;
    string avatar_url = 8;
    repeated RoleDto roles = 9;
    string phone = 10;
    string name = 11;
}

message RoleDto {
    string id = 1;
    string name = 2;
    repeated string permissions = 3;
}

message AccountStatsResponse {
    int64 total_users = 1;
    int64 active_users = 2;
    int64 banned_users = 3;
    int64 new_users_this_month = 4;
}

message BanAccountRequest {
    string admin_id = 1;
    string account_id = 2;
    string reason = 3;
    string expires_at = 4;
}

message UnbanAccountRequest {
    string admin_id = 1;
    string account_id = 2;
}

message ActivateAccountRequest {
    string admin_id = 1;
    string account_id = 2;
}

message UpdateUserStatusRequest {
    string admin_id = 1;
    string account_id = 2;
    string status = 3;
}

message DeleteAccountRequest {
    string admin_id = 1;
    string account_id = 2;
}

message RoleListResponse {
    repeated RoleDto roles = 1;
}

message CreateRoleRequest {
    string name = 1;
    int32 position = 2;
    repeated string permissions = 3;
}

message UpdateRoleRequest {
    string id = 1;
    string name = 2;
    int32 position = 3;
    repeated string permissions = 4;
}

message DeleteRoleRequest {
    string id = 1;
}

message SyncRolePermissionsRequest {
    string role_id = 1;
    repeated string permissions = 2;
}

message AssignRoleRequest {
    string admin_id = 1;
    string account_id = 2;
    string role_id = 3;
}

message RevokeRoleRequest {
    string admin_id = 1;
    string account_id = 2;
    string role_id = 3;
}

message UpdateAccountProfileRequest {
    string account_id = 1;
    string display_name = 2;
    string first_name = 3;
    string last_name = 4;
}
