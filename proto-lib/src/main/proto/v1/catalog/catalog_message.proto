syntax = "proto3";

package v1.catalog;

option java_multiple_files = true;
option java_package = "com.furnisight.catalog";

message GetProductSummariesRequest {
  repeated GetProductSummaryItem items = 1;
  repeated string product_ids = 2 [deprecated = true];
}

message GetProductSummariesResponse {
  repeated ProductSummary products = 1;
}

// Lightweight product display data for favorite lists and other simple tiles.
message GetFavoriteProductSummariesRequest {
  repeated string product_ids = 1;
}

message GetFavoriteProductSummariesResponse {
  repeated FavoriteProductSummary products = 1;
}

message GetProductSummaryItem {
  string product_id = 1;
  string selected_variant_id = 2;
}

message ProductSummary {
  string id = 1;
  string slug = 2;
  string name = 3;
  string image = 4;
  ProductSummaryVariant variant = 5;
  string selected_variant_id = 6;
  repeated ProductSummaryVariant variants = 7;
}

message ProductSummaryVariant {
  reserved 3;
  reserved "old_price";

  string id = 1;
  optional double price = 2;
  optional int32 stock_quantity = 4;
  optional double length = 5;
  optional double width = 6;
  optional double height = 7;
  optional double weight = 8;
  string color = 9;
  string material = 10;
  string warranty = 11;
  string model_url = 12;
  repeated string image_urls = 13;
  bool supports3d = 14;
}

message FavoriteProductSummary {
  reserved 7;
  reserved "old_price";

  string id = 1;
  string slug = 2;
  string name = 3;
  string image = 4;
  string category_name = 5;
  optional double price = 6;
  int32 sold_count = 8;
}

message SearchRecommendedProductsRequest {
  string category_slug = 1;
  int32 limit = 2;
  string status = 3;
}

message SearchRecommendedProductsResponse {
  repeated RecommendedProduct products = 1;
}

message RecommendedProduct {
  string id = 1;
  string slug = 2;
  string name = 3;
  string category_name = 4;
  optional double price = 5;
  string image = 6;
  string model_url = 7 [deprecated = true];
  string default_variant_id = 8;
  double rating = 9;
  int32 rating_count = 10;
  int32 sold_count = 11;
  repeated string tags = 12;
  repeated ProductSummaryVariant variants = 13;
}
// v2: model_url added to ProductSummaryVariant, variants added to RecommendedProduct
// v3: variant image_urls/supports3d added; product-level model_url deprecated
