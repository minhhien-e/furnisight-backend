syntax = "proto3";

package v1.catalog;

option java_multiple_files = true;
option java_package = "com.furnisight.catalog";

import "v1/catalog/catalog_message.proto";

service CatalogService {
    rpc GetProductSummaries (GetProductSummariesRequest) returns (GetProductSummariesResponse);
    rpc GetFavoriteProductSummaries (GetFavoriteProductSummariesRequest) returns (GetFavoriteProductSummariesResponse);
    rpc SearchRecommendedProducts (SearchRecommendedProductsRequest) returns (SearchRecommendedProductsResponse);
    rpc CheckProductStocks (CheckProductStocksRequest) returns (CheckProductStocksResponse);
}
