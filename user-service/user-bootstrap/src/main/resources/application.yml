server:
  port: 8081
  tomcat:
    threads:
      max: 1000
    accept-count: 2000
    max-connections: 10000
  forward-headers-strategy: framework
  servlet:
    context-path: /api/v1
    session:
      cookie:
        path: /
        same-site: none
        secure: true
grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}
  client:
    catalog-service:
      address: ${CATALOG_SERVICE_GRPC_ADDRESS:dns:///localhost:9090}
      negotiationType: plaintext
    media-service:
      address: ${GRPC_MEDIA_SERVICE_ADDRESS:static://localhost:9090}
      negotiationType: plaintext
spring:
  application:
    name: user-service
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:8081/api/v1/login/oauth2/code/google}
        provider:
          google:
            issuer-uri: https://accounts.google.com

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/furnisight_user_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 2
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: user-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

jwt:
  private-key: ${JWT_PRIVATE_KEY}
  public-key: ${JWT_PUBLIC_KEY}
  access-token-expiration-ms: 900000 # 15 minutes
  refresh-token-expiration-ms: 604800000 # 7 days
  verification-token-expiration-ms: 86400000 # 24 hours
  reset-password-token-expiration-ms: 3600000 # 1 hour

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  verify-url: ${VERIFY_URL:http://localhost:8080/users/auth/verify?otpCode=}
