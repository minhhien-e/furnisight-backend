server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /api/v1

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9093}
  client:
    media-service:
      address: "static://${MEDIA_SERVICE_GRPC_HOST:localhost}:${MEDIA_SERVICE_GRPC_PORT:9094}"
      negotiationType: plaintext
    reviewService:
      address: "dns:///${REVIEW_SERVICE_GRPC_HOST:localhost}:${REVIEW_SERVICE_GRPC_PORT:9097}"
      negotiationType: plaintext

spring:
  application:
    name: catalog-service
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}


  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/furnisight_catalog_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:catalog-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

translation:
  enabled: ${TRANSLATION_ENABLED:true}
  provider: ${TRANSLATION_PROVIDER:libretranslate}
  base-url: ${TRANSLATION_BASE_URL:http://libretranslate:5000}
  timeout: ${TRANSLATION_TIMEOUT:3s}
  cache-ttl: ${TRANSLATION_CACHE_TTL:30d}
  cache-maximum-size: ${TRANSLATION_CACHE_MAXIMUM_SIZE:10000}
