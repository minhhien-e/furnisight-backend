server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9097}
  client:
    media-service:
      address: ${MEDIA_SERVICE_GRPC_ADDRESS:dns:///localhost:9094}
      negotiationType: plaintext
    order-service:
      address: ${ORDER_SERVICE_GRPC_ADDRESS:dns:///localhost:9095}
      negotiationType: plaintext
    ai-review-sentiment:
      address: ${AI_REVIEW_SENTIMENT_GRPC_ADDRESS:dns:///localhost:9090}
      negotiationType: plaintext

spring:
  application:
    name: review-service
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/furnisight_review_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:review-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info
