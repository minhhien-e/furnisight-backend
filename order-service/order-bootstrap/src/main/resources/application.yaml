server:
  port: 8085
  forward-headers-strategy: framework
  servlet:
    context-path: /api/v1
grpc:
  server:
    port: 9095
  client:
    promotion-service:
      address: "static://${PROMOTION_SERVICE_GRPC_HOST:localhost}:${PROMOTION_SERVICE_GRPC_PORT:9096}"
      negotiation-type: plaintext
    user-service:
      address: "static://${USER_SERVICE_GRPC_HOST:localhost}:${USER_SERVICE_GRPC_PORT:9091}"
      negotiation-type: plaintext
    catalog-service:
      address: "static://${CATALOG_SERVICE_GRPC_HOST:localhost}:${CATALOG_SERVICE_GRPC_PORT:9093}"
      negotiation-type: plaintext
spring:
  application:
    name: order-service
  jackson:
    default-property-inclusion: non_null

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
    consumer:
      group-id: order-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      missing-topics-fatal: false

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:8ND6L7V9}
  hash-secret: ${VNPAY_HASH_SECRET:YXXNZZXXOOWQEYXUWWXYXYXZX}
  url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:3000/payment/callback}
  api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

translation:
  enabled: ${TRANSLATION_ENABLED:true}
  base-url: ${TRANSLATION_BASE_URL:http://libretranslate:5000}
