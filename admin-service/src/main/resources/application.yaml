server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: admin-service

grpc:
  client:
    user-service:
      address: "static://${USER_SERVICE_GRPC_HOST:localhost}:${USER_SERVICE_GRPC_PORT:9091}"
      negotiation-type: plaintext
    order-service:
      address: "static://${ORDER_SERVICE_GRPC_HOST:localhost}:${ORDER_SERVICE_GRPC_PORT:9095}"
      negotiation-type: plaintext
    catalog-service:
      address: "static://${CATALOG_SERVICE_GRPC_HOST:localhost}:${CATALOG_SERVICE_GRPC_PORT:9093}"
      negotiation-type: plaintext

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

services:
  user:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8080/api/v1}
