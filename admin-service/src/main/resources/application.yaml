server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: admin-service
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/furnisight_admin_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
    consumer:
      group-id: admin-order-audit-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false

grpc:
  client:
    user-service:
      address: ${USER_SERVICE_GRPC_ADDRESS:dns:///localhost:9091}
      negotiation-type: plaintext
    order-service:
      address: ${ORDER_SERVICE_GRPC_ADDRESS:dns:///localhost:9095}
      negotiation-type: plaintext
    catalog-service:
      address: ${CATALOG_SERVICE_GRPC_ADDRESS:dns:///localhost:9093}
      negotiation-type: plaintext
    reviewService:
      address: ${REVIEW_SERVICE_GRPC_ADDRESS:dns:///localhost:9097}
      negotiation-type: plaintext
    promotion-service:
      address: ${PROMOTION_SERVICE_GRPC_ADDRESS:dns:///localhost:9096}
      negotiation-type: plaintext
    message-service:
      address: ${MESSAGE_SERVICE_GRPC_ADDRESS:dns:///localhost:9098}
      negotiation-type: plaintext

promotion:
  service:
    http-url: ${PROMOTION_SERVICE_HTTP_URL:http://promotion-service:8080}

message:
  service:
    http-url: ${MESSAGE_SERVICE_HTTP_URL:http://message-service:8080}


management:

  endpoints:
    web:
      exposure:
        include: health,info,prometheus

