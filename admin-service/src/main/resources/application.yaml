server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: admin-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/furnisight_admin_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

grpc:
  client:
    user-service:
      address: "static://${USER_SERVICE_GRPC_HOST:localhost}:${USER_SERVICE_GRPC_PORT:9091}"
      negotiation-type: plaintext
    order-service:
      address: "static://${ORDER_SERVICE_GRPC_HOST:localhost}:${ORDER_SERVICE_GRPC_PORT:9095}"
      negotiation-type: plaintext
    catalog-service:
      address: "static://${CATALOG_SERVICE_GRPC_HOST:localhost}:${CATALOG_SERVICE_GRPC_PORT:9093}"
      negotiation-type: plaintext

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

admin:
  inventory:
    default-low-stock-threshold: ${ADMIN_INVENTORY_DEFAULT_LOW_STOCK_THRESHOLD:5}
    settings-file: ${ADMIN_INVENTORY_SETTINGS_FILE:/app/data/inventory-warning-settings.json}
