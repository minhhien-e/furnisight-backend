<!DOCTYPE html>
<html>
<head>
  <script src="https://editor.unlayer.com/embed.js"></script>
</head>
<body>
  <button id="openBtn">Open Unlayer 1</button>
  <button id="closeBtn">Close Unlayer</button>
  <button id="openBtn2">Open Unlayer 2</button>
  <div id="container-wrapper"></div>
  <script>
    document.getElementById('openBtn').addEventListener('click', () => {
      document.getElementById('container-wrapper').innerHTML = '<div id="editor"></div>';
      unlayer.init({ id: 'editor', displayMode: 'email' });
      unlayer.addEventListener('editor:ready', () => console.log('ready 1'));
    });
    document.getElementById('closeBtn').addEventListener('click', () => {
      document.getElementById('container-wrapper').innerHTML = '';
    });
    document.getElementById('openBtn2').addEventListener('click', () => {
      document.getElementById('container-wrapper').innerHTML = '<div id="editor"></div>';
      unlayer.init({ id: 'editor', displayMode: 'email' });
      unlayer.addEventListener('editor:ready', () => console.log('ready 2'));
    });
  </script>
</body>
</html>
